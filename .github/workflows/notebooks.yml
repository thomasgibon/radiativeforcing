name: Notebook checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Execute impulse-response notebook
        run: >-
          uv run jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300 --output-dir build/notebooks
          notebooks/01_impulse_response_and_gwp.ipynb

      - name: Execute emission-profile notebook
        run: >-
          uv run jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=300 --output-dir build/notebooks
          notebooks/02_emission_profiles_and_convolution.ipynb

