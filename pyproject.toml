[project]
name = "radiativeforcing"
version = "0.1.0"
description = "Educational models and visualizations of greenhouse-gas radiative forcing and global warming potential"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "tqdm>=4.66,<5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.2,<5",
    "nbconvert>=7.16,<8",
    "pytest>=8,<10",
]

[tool.uv]
package = false

